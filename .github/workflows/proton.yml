name: Ares 4.14 proton

on:
  workflow_dispatch:
    inputs:
      ksu_enabled:
        description: '是否集成 ReSukiSU (Manual Hook)'
        required: true
        type: boolean
        default: true
      droidspaces_enabled:
        description: '是否集成 Droidspaces 支持'
        required: true
        type: boolean
        default: true
      use_anykernel:
        description: '是否使用 AnyKernel3 打包刷入包'
        required: true
        type: boolean
        default: true
      fake_enabled:
        description: '是否进行编译伪装'
        required: true
        type: boolean
        default: false
      ccache_enabled:
        description: '是否启用 ccache 加速编译'
        required: true
        type: boolean
        default: true
      ccache_update:
        description: '更新 ccache 缓存'
        required: true
        type: boolean
        default: false
      release:
        description: '是否发布到 GitHub Releases'
        required: true
        type: boolean
        default: true
      kernel_suffix:
        description: '自定义内核后缀'
        required: false
        type: string
        default: ''
      kbuild_build_user:
        description: '伪装编译用户名'
        required: false
        type: string
        default: ''
      kbuild_build_host:
        description: '伪装编译主机名'
        required: false
        type: string
        default: ''
      kbuild_build_timestamp:
        description: '伪装编译时间'
        required: false
        type: string
        default: ''
      kbuild_build_version:
        description: '伪装编译版本'
        required: false
        type: string
        default: '1'
      fake_extraversion:
        description: '伪装内核版本号后缀'
        required: false
        type: string
        default: ''
      fake_compiler:
        description: '伪装编译器信息'
        required: false
        type: string
        default: ''

env:
  TZ: Asia/Shanghai
  KERNEL_NAME: Ares-4.14-KVM-Proton-release
  KERNEL_REPO: https://github.com/dawood333/mtk6893
  KERNEL_BRANCH: d
  KERNEL_DEVICE: ares
  DEFCONFIG_NAME: ares_defconfig
  PROTON_REPO: https://gitlab.com/LeCmnGend/proton-clang.git
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  ANYKERNEL_BRANCH: master
  ARCH: arm64
  OUT_DIR: ${{ github.workspace }}/out
  FAKE_EXTRAVERSION: ${{ inputs.fake_extraversion }}
  FAKE_COMPILER: ${{ inputs.fake_compiler }}
  CCACHE_KEY: ccache-ares-4.14-a16

jobs:
  build:
    name: 构建内核
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: 初始化构建环境
        id: setup_env
        run: |
          echo "builddate=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libfl-dev curl git ccache zip unzip flex bison python3 wget

      - name: 克隆内核源码
        run: |
          git clone --recursive --depth=1 -j "$(nproc)" \
            --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_NAME"

      - name: 获取 Proton Clang
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchains"
          git clone --depth=1 --single-branch -b clang-15 \
            "$PROTON_REPO" "$HOME/toolchains/proton-clang"
          test -x "$HOME/toolchains/proton-clang/bin/clang"
          test -x "$HOME/toolchains/proton-clang/bin/ld.lld"
          echo "$HOME/toolchains/proton-clang/bin" >> "$GITHUB_PATH"
          "$HOME/toolchains/proton-clang/bin/clang" --version
          "$HOME/toolchains/proton-clang/bin/ld.lld" --version

      - name: 准备 AnyKernel3
        if: inputs.use_anykernel
        run: |
          git clone --recursive --depth=1 -j "$(nproc)" \
            --branch "$ANYKERNEL_BRANCH" "$ANYKERNEL_REPO" AnyKernel3
          rm -f AnyKernel3/anykernel.sh
          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Ares Custom Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF

      - name: 配置 ccache
        if: inputs.ccache_enabled
        run: |
          ccache -o compression=true -o cache_dir="$HOME/.ccache"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: 载入 ccache 缓存
        if: inputs.ccache_enabled && !inputs.ccache_update
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_KEY }}-

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_enabled && inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="${CCACHE_KEY}-${{ runner.os }}-${{ github.ref_name }}-"
          mapfile -t KEYS < <(gh cache list -R '${{ github.repository }}' --key "$PREFIX" --limit 100 --json key --jq '.[].key')
          for k in "${KEYS[@]}"; do
            gh cache delete "$k" -R '${{ github.repository }}' || true
          done

      - name: 集成 ReSukiSU (Manual Hook)
        if: inputs.ksu_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          rm -rf ./KernelSU ./drivers/kernelsu
          curl -fLSs https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh -o /tmp/resukisu-setup.sh
          bash /tmp/resukisu-setup.sh main
          cat >> "arch/${ARCH}/configs/${DEFCONFIG_NAME}" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KALLSYMS_ABSOLUTE_PERCPU=y
          EOF

      - name: 集成 Droidspaces 支持
        if: inputs.droidspaces_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          PATCH_SRC="${{ github.workspace }}/droidspaces-src"
          rm -rf "$PATCH_SRC"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/seriaTvT/Droidspaces-OSS "$PATCH_SRC"
          git -C "$PATCH_SRC" sparse-checkout set Documentation/resources/kernel-patches/non-GKI
          NON_GKI="$PATCH_SRC/Documentation/resources/kernel-patches/non-GKI"
          shopt -s nullglob
          for patch in "$NON_GKI"/*.patch; do
            name="$(basename "$patch")"
            mapfile -t targets < <(grep '^+++ ' "$patch" | sed -E 's#^\+\+\+ b/##; s/\t.*$//' || true)
            if git apply --reverse --check "$patch" >/dev/null 2>&1; then
              echo "Already applied: $name"
              continue
            fi
            if git apply --check "$patch" >/dev/null 2>&1; then
              git apply "$patch"
              echo "Applied: $name"
              continue
            fi
            missing_all=true
            for t in "${targets[@]}"; do
              [ -e "$t" ] && missing_all=false
            done
            if [ "$missing_all" = true ]; then
              echo "::warning::Skipping inapplicable patch: $name"
              continue
            fi
            echo "::error::Patch conflict: $name"
            exit 1
          done
          DEFCONFIG="arch/${ARCH}/configs/${DEFCONFIG_NAME}"
          if ! grep -q 'Droidspaces support (non-GKI)' "$DEFCONFIG"; then
          cat >> "$DEFCONFIG" <<'EOF'
          # ===== Droidspaces support (non-GKI) =====
          CONFIG_FHANDLE=y
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_MATCH_HL=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_IP_NF_TARGET_ULOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          CONFIG_NETFILTER_NETLINK_LOG=y
          CONFIG_NETFILTER_XT_TARGET_NFLOG=y
          CONFIG_ARM64_VHE=y
          EOF
          fi

      - name: 伪装内核版本信息
        if: inputs.fake_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          IN_BUILD_USER: ${{ inputs.kbuild_build_user }}
          IN_BUILD_HOST: ${{ inputs.kbuild_build_host }}
          IN_BUILD_TIMESTAMP: ${{ inputs.kbuild_build_timestamp }}
          IN_BUILD_VERSION: ${{ inputs.kbuild_build_version }}
        run: |
          if [ -n "$IN_BUILD_USER" ]; then echo "KBUILD_BUILD_USER=$IN_BUILD_USER" >> "$GITHUB_ENV"; fi
          if [ -n "$IN_BUILD_HOST" ]; then echo "KBUILD_BUILD_HOST=$IN_BUILD_HOST" >> "$GITHUB_ENV"; fi
          if [ -n "$IN_BUILD_TIMESTAMP" ]; then echo "KBUILD_BUILD_TIMESTAMP=$IN_BUILD_TIMESTAMP" >> "$GITHUB_ENV"; fi
          if [ -n "$IN_BUILD_VERSION" ]; then echo "KBUILD_BUILD_VERSION=$IN_BUILD_VERSION" >> "$GITHUB_ENV"; fi
          if [ -n "$FAKE_EXTRAVERSION" ]; then
            ESCAPED_EXTRA=$(printf '%s\n' "$FAKE_EXTRAVERSION" | sed 's/[&/\\]/\\&/g')
            sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = ${ESCAPED_EXTRA}/" Makefile
            sed -i '2i exit 0' scripts/setlocalversion
          fi
          if [ -n "$FAKE_COMPILER" ]; then
            ESCAPED_COMPILER=$(printf '%s\n' "$FAKE_COMPILER" | sed 's/[&|\\]/\\&/g')
            if ! grep -Fq '"$CC_VERSION, $LD_VERSION"' scripts/mkcompile_h; then
              echo '::error::Compiler string not found in mkcompile_h'
              exit 1
            fi
            sed -i "s|\"\$CC_VERSION, \$LD_VERSION\"|\"${ESCAPED_COMPILER}\"|" scripts/mkcompile_h
          fi

      - name: 生成 defconfig
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          IN_SUFFIX: ${{ inputs.kernel_suffix }}
        run: |
          CC_CMD=clang
          if [[ '${{ inputs.ccache_enabled }}' == 'true' ]]; then CC_CMD='ccache clang'; fi
          if [[ '${{ inputs.fake_enabled }}' != 'true' && -n "$IN_SUFFIX" ]]; then export LOCALVERSION="-$IN_SUFFIX"; fi
          make -j"$(nproc)" O="$OUT_DIR" ARCH="$ARCH" CC="$CC_CMD" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf \
            STRIP=llvm-strip OBJSIZE=llvm-size "$DEFCONFIG_NAME"

      - name: 编译内核与设备树
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          IN_SUFFIX: ${{ inputs.kernel_suffix }}
        run: |
          CC_CMD=clang
          if [[ '${{ inputs.ccache_enabled }}' == 'true' ]]; then CC_CMD='ccache clang'; ccache -z; fi
          if [[ '${{ inputs.fake_enabled }}' != 'true' && -n "$IN_SUFFIX" ]]; then export LOCALVERSION="-$IN_SUFFIX"; fi
          make -j"$(nproc)" O="$OUT_DIR" ARCH="$ARCH" CC="$CC_CMD" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf \
            STRIP=llvm-strip OBJSIZE=llvm-size Image dtbs

      - name: 输出 ccache 统计
        if: inputs.ccache_enabled && always()
        run: ccache -s

      - name: 保存 ccache 缓存
        if: inputs.ccache_enabled && success()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: 校验内核与设备树镜像
        id: prepare_image
        env:
          IN_SUFFIX: ${{ inputs.kernel_suffix }}
        run: |
          set -euo pipefail
          BOOT_DIR="$OUT_DIR/arch/$ARCH/boot"
          BUILDDATE='${{ steps.setup_env.outputs.builddate }}'
          SUFFIX_STR="${IN_SUFFIX:+-${IN_SUFFIX}}"
          echo "image_name=Image-${KERNEL_DEVICE}-${KERNEL_NAME}${SUFFIX_STR}-${BUILDDATE}" >> "$GITHUB_OUTPUT"
          echo "dtb_name=dtb-${KERNEL_DEVICE}-${KERNEL_NAME}${SUFFIX_STR}-${BUILDDATE}" >> "$GITHUB_OUTPUT"
          test -s "$BOOT_DIR/Image" || { echo '::error::Image missing'; exit 1; }
          find "$BOOT_DIR/dts" -name '*.dtb' -type f -exec cat {} + > "$BOOT_DIR/dtb"
          test -s "$BOOT_DIR/dtb" || { echo '::error::DTB missing'; exit 1; }

      - name: 打包 AnyKernel3
        if: inputs.use_anykernel
        id: pack_anykernel
        env:
          IN_SUFFIX: ${{ inputs.kernel_suffix }}
        run: |
          set -euo pipefail
          BOOT_DIR="$OUT_DIR/arch/$ARCH/boot"
          BUILDDATE='${{ steps.setup_env.outputs.builddate }}'
          SUFFIX_STR="${IN_SUFFIX:+-${IN_SUFFIX}}"
          AK3_NAME="${KERNEL_DEVICE}-${KERNEL_NAME}${SUFFIX_STR}_${BUILDDATE}"
          for f in Image Image.gz dtb dtbo dtbo.img; do
            if [ -f "$BOOT_DIR/$f" ]; then cp -f "$BOOT_DIR/$f" AnyKernel3/; fi
          done
          (cd AnyKernel3 && zip -q -r "${{ github.workspace }}/${AK3_NAME}.zip" .)
          echo "ak3name=${AK3_NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: 上传 AnyKernel3 刷入包
        if: inputs.use_anykernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack_anykernel.outputs.ak3name }}
          path: ${{ github.workspace }}/${{ steps.pack_anykernel.outputs.ak3name }}
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_image.outputs.image_name }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: error
          retention-days: 7

      - name: 上传 dtb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_image.outputs.dtb_name }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 Release
    if: inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./release_files

      - name: 设置发布环境变量
        env:
          IN_SUFFIX: ${{ inputs.kernel_suffix }}
          IN_BUILD_USER: ${{ inputs.kbuild_build_user }}
          IN_BUILD_HOST: ${{ inputs.kbuild_build_host }}
          IN_BUILD_TIMESTAMP: ${{ inputs.kbuild_build_timestamp }}
          IN_BUILD_VERSION: ${{ inputs.kbuild_build_version }}
        run: |
          TIME="$(TZ=Asia/Shanghai date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
          FULL_VERSION="$KERNEL_NAME${IN_SUFFIX:+-$IN_SUFFIX}"
          KSU_STATUS='未集成'; if [[ '${{ inputs.ksu_enabled }}' == 'true' ]]; then KSU_STATUS='ReSukiSU (Manual Hook)'; fi
          DS_STATUS='未集成'; if [[ '${{ inputs.droidspaces_enabled }}' == 'true' ]]; then DS_STATUS='已集成 (官方补丁 + 内核配置)'; fi
          FAKE_INFO='未伪装（真实环境）'; FAKE_TIME="$FAKE_INFO"; FAKE_VER="$FAKE_INFO"
          if [[ '${{ inputs.fake_enabled }}' == 'true' ]]; then
            FAKE_INFO="${IN_BUILD_USER}@${IN_BUILD_HOST}"
            FAKE_TIME="$IN_BUILD_TIMESTAMP"
            FAKE_VER="$IN_BUILD_VERSION"
          fi
          {
            echo "TIME=$TIME"
            echo "TIME_FORM=$TIME_FORM"
            echo 'TAG_HEAD=ares-build'
            echo "FULL_VERSION=$FULL_VERSION"
            echo "KSU_STATUS=$KSU_STATUS"
            echo "DS_STATUS=$DS_STATUS"
            echo "FAKE_INFO=$FAKE_INFO"
            echo "FAKE_TIME=$FAKE_TIME"
            echo "FAKE_VER=$FAKE_VER"
          } >> "$GITHUB_ENV"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release_notes.md <<EOF
          ### 构建信息
          - 设备: ares (Redmi K40 Gaming)
          - 内核分支: ${KERNEL_BRANCH}
          - 内核版本: ${FULL_VERSION}
          - 编译时间: ${TIME_FORM}
          - 工具链: Proton Clang clang-15 (${PROTON_REPO})
          - KernelSU: ${KSU_STATUS}
          - Droidspaces: ${DS_STATUS}
          - AnyKernel3 打包: ${{ inputs.use_anykernel }}
          - CCache 加速: ${{ inputs.ccache_enabled }}
          - 伪装启用: ${{ inputs.fake_enabled }}
          - 伪装信息: ${FAKE_INFO}
          - 伪装时间: ${FAKE_TIME}
          - 伪装版本: ${FAKE_VER}
          EOF
          shopt -s nullglob
          RELEASE_FILES=(./release_files/*/*.zip ./release_files/*/Image ./release_files/*/dtb)
          if [ "${#RELEASE_FILES[@]}" -eq 0 ]; then echo '::error::No release files'; exit 1; fi
          gh release create "${TAG_HEAD}-${TIME}" \
            --repo '${{ github.repository }}' \
            --title "${FULL_VERSION}-${TIME}" \
            --notes-file release_notes.md "${RELEASE_FILES[@]}"
            
