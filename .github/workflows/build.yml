name: Chopin 4.14 内核构建

env:
  TZ: Asia/Shanghai

  # ── 内核源码 ──
  KERNEL_NAME: Chopin-A16-KVM-Proton-release
  KERNEL_REPO: https://github.com/seriaTvT/kernel_xiaomi_mt6893
  KERNEL_BRANCH: ${{ inputs.overclock && 'chopin_kvm_oc' || 'chopin_kvm' }}
  KERNEL_DEVICE: chopin
  DEFCONFIG_NAME: chopin_defconfig

  # ── 工具链 (Proton Clang) ──
  CLANG_REPO: https://github.com/kdrag0n/proton-clang
  CLANG_BRANCH: master
  CLANG_NAME: proton-clang

  # ── AnyKernel3 ──
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  ANYKERNEL_BRANCH: master

  # ── 构建参数 ──
  ARCH: arm64
  OUT_DIR: "${{ github.workspace }}/out"

  # ── KBUILD 伪装配置 ──
  KBUILD_BUILD_USER: ${{ inputs.kbuild_build_user }}
  KBUILD_BUILD_HOST: ${{ inputs.kbuild_build_host }}
  KBUILD_BUILD_TIMESTAMP: ${{ inputs.kbuild_build_timestamp }}
  KBUILD_BUILD_VERSION: ${{ inputs.kbuild_build_version }}
  FAKE_EXTRAVERSION: ${{ inputs.fake_extraversion }}
  FAKE_COMPILER: ${{ inputs.fake_compiler }}

  # ── ccache ──
  CCACHE_KEY: ccache-chopin-4.14-a16

on:
  workflow_dispatch:
    inputs:
      overclock:
        description: '是否使用超频内核分支 (true: chopin_kvm_oc, false: chopin_kvm)'
        required: true
        type: boolean
        default: true

      ksu_enabled:
        description: '是否集成 ReSukiSU (Manual Hook)'
        required: true
        type: boolean
        default: true

      use_anykernel:
        description: '是否使用 AnyKernel3 打包刷入包（关闭时仅上传 Image）'
        required: true
        type: boolean
        default: true

      fake_enabled:
        description: '是否进行编译伪装'
        required: true
        type: boolean
        default: false
        
      ccache_enabled:
        description: '是否启用 ccache 加速编译'
        required: true
        type: boolean
        default: true

      ccache_update:
        description: '更新 ccache 缓存（更改编译配置或需要刷新缓存时开启）'
        required: true
        type: boolean
        default: false

      release:
        description: '是否发布到 GitHub Releases'
        required: true
        type: boolean
        default: true

      kernel_suffix:
        description: '自定义内核后缀（留空使用默认，开头勿加连字符）'
        required: false
        type: string
        default: ''

      kbuild_build_user:
        description: '伪装编译用户名 (KBUILD_BUILD_USER)'
        required: false
        type: string
        default: 'builder'

      kbuild_build_host:
        description: '伪装编译主机名 (KBUILD_BUILD_HOST)'
        required: false
        type: string
        default: 'android-builder'

      kbuild_build_timestamp:
        description: '伪装编译时间 (KBUILD_BUILD_TIMESTAMP)'
        required: false
        type: string
        default: 'Fri Mar 28 13:14:00 CST 2025'

      kbuild_build_version:
        description: '伪装编译版本 (KBUILD_BUILD_VERSION)'
        required: false
        type: string
        default: '1'

      fake_extraversion:
        description: '伪装内核版本号后缀 (FAKE_EXTRAVERSION)'
        required: false
        type: string
        default: '-g88e8616a5866'

      fake_compiler:
        description: '伪装编译器信息 (FAKE_COMPILER)'
        required: false
        type: string
        default: '(Android (7284624, based on r416183b) clang version 12.0.5 (https://android.googlesource.com/toolchain/llvm-project c935d99d7cf2016289302412d708641d52d2f7ee), LLD 12.0.5 (/buildbot/src/android/llvm-toolchain/out/llvm-project/lld c935d99d7cf2016289302412d708641d52d2f7ee))'

jobs:
  # ============================================================
  #  构建内核
  # ============================================================
  build:
    name: 构建内核
    runs-on: ubuntu-22.04
    outputs:
      ak3name: ${{ steps.pack_anykernel.outputs.ak3name }}
      image_name: ${{ steps.prepare_image.outputs.image_name }}
      dtb_name: ${{ steps.prepare_image.outputs.dtb_name }}
      builddate: ${{ steps.setup_env.outputs.builddate }}
    steps:

      # ── 1. 初始化构建环境 ──
      - name: 初始化构建环境
        id: setup_env
        run: |
          echo "builddate=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

          # 禁用较慢的 Azure 镜像
          sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libfl-dev curl git ccache python2 python2-dev zip unzip

      # ── 2. 克隆内核源码 ──
      - name: 克隆内核源码
        run: |
          git clone --recursive --depth=1 -j $(nproc) \
            --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} \
            ${{ env.KERNEL_NAME }}

      # ── 3. 获取工具链 (AOSP Clang 12 & GCC 4.9) ──
      - name: 获取工具链
        run: |
          mkdir -p aosp-clang
          # 下载官方 AOSP Clang 12.0.5 (r416183b)
          wget -qO clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz
          tar -xf clang.tar.gz -C aosp-clang
          
          # 克隆 AOSP GCC 4.9 (Linux 4.14 汇编与部分链接依赖)
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 aarch64-gcc
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 arm-gcc
          
          # 导入环境变量
          echo "${{ github.workspace }}/aosp-clang/bin" >> $GITHUB_PATH
          echo "CLANG_DIR=${{ github.workspace }}/aosp-clang/bin" >> $GITHUB_ENV
          echo "GCC_64_DIR=${{ github.workspace }}/aarch64-gcc/bin" >> $GITHUB_ENV
          echo "GCC_32_DIR=${{ github.workspace }}/arm-gcc/bin" >> $GITHUB_ENV

      # ── 4. 准备 AnyKernel3 ──
      - name: 准备 AnyKernel3
        if: inputs.use_anykernel
        run: |
          git clone --recursive --depth=1 -j $(nproc) \
            --branch ${{ env.ANYKERNEL_BRANCH }} \
            ${{ env.ANYKERNEL_REPO }} \
            AnyKernel3

          # Remove the example anykernel.sh and write a minimal custom one
          rm -f AnyKernel3/anykernel.sh
          cat << 'EOF' > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=Chopin Custom Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }
          
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          
          . tools/ak3-core.sh;
          
          split_boot;
          flash_boot;
          EOF

      # ── 5. 配置并恢复 ccache ──
      - name: 配置 ccache
        if: inputs.ccache_enabled
        run: |
          ccache -o compression=false -o cache_dir=$HOME/.ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 载入 ccache 缓存
        if: inputs.ccache_enabled
        uses: actions/cache@v4
        id: ccache_restore
        with:
          path: ~/.ccache
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_KEY }}-

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_enabled && inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          CACHE_KEY="${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}"
          if gh cache delete "$CACHE_KEY" -R ${{ github.repository }}; then
            echo "成功删除旧的 ccache 缓存！"
          else
            echo "旧缓存不存在或已被清理。"
          fi

      # ── 6. 集成 ReSukiSU ──
      - name: 集成 ReSukiSU (Manual Hook)
        if: inputs.ksu_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          if [ -d "./KernelSU" ]; then
            rm -rf "./KernelSU"
          fi
          if [ -d "./drivers/kernelsu" ]; then
            rm -rf "./drivers/kernelsu"
          fi

          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

          echo -e "CONFIG_KSU=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KSU_MANUAL_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          echo -e "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          echo -e "CONFIG_KALLSYMS=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KALLSYMS_ALL=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo -e "CONFIG_KALLSYMS_ABSOLUTE_PERCPU=y" >> arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}


          cat arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

      # ── 7. 版本伪装 ──
      - name: 伪装内核版本信息
        if: inputs.fake_enabled
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          # 修改 Makefile 中的 EXTRAVERSION
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = ${FAKE_EXTRAVERSION}/" Makefile

          # 禁用 Git 自动追加版本号
          sed -i '2i exit 0' scripts/setlocalversion

          # 伪装编译器字符串 (scripts/mkcompile_h COMPILER)
          ESCAPED_COMPILER=$(printf '%s\n' "${FAKE_COMPILER}" | sed 's/[&/\\]/\\&/g')
          sed -i "s/^COMPILER=.*/COMPILER=\"${ESCAPED_COMPILER}\"/" scripts/mkcompile_h

      # ── 8. 编译内核 ──
      - name: 生成 defconfig
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          if [[ "${{ inputs.ccache_enabled }}" == "true" ]]; then
            CC_CMD="ccache clang"
          else
            CC_CMD="clang"
          fi

          # 如果未开启伪装且提供了后缀，将其作为内部版本号后缀
          if [[ "${{ inputs.fake_enabled }}" != "true" && -n "${{ inputs.kernel_suffix }}" ]]; then
            export LOCALVERSION="-${{ inputs.kernel_suffix }}"
          fi

          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC="${CC_CMD}" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${{ env.GCC_64_DIR }}/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="${{ env.GCC_32_DIR }}/arm-linux-androideabi-" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            OBJSIZE=llvm-size \
            ${{ env.DEFCONFIG_NAME }}

      - name: 编译内核与设备树
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          if [[ "${{ inputs.ccache_enabled }}" == "true" ]]; then
            CC_CMD="ccache clang"
          else
            CC_CMD="clang"
          fi

          # 如果未开启伪装且提供了后缀，将其作为内部版本号后缀
          if [[ "${{ inputs.fake_enabled }}" != "true" && -n "${{ inputs.kernel_suffix }}" ]]; then
            export LOCALVERSION="-${{ inputs.kernel_suffix }}"
          fi

          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC="${CC_CMD}" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${{ env.GCC_64_DIR }}/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="${{ env.GCC_32_DIR }}/arm-linux-androideabi-" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            OBJSIZE=llvm-size \
            Image dtbs

      # ── 9. 保存 ccache ──
      - name: 保存 ccache 缓存
        if: inputs.ccache_enabled && (inputs.ccache_update || steps.ccache_restore.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ env.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      # ── 11. 准备产物 ──
      - name: 校验内核与设备树镜像
        id: prepare_image
        run: |
          BOOT_DIR="${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot"
          BUILDDATE="${{ steps.setup_env.outputs.builddate }}"
          SUFFIX="${{ inputs.kernel_suffix }}"
          SUFFIX_STR="${SUFFIX:+-${SUFFIX}}"
          IMAGE_NAME="Image-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}${SUFFIX_STR}-${BUILDDATE}"
          DTB_NAME="dtb-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}${SUFFIX_STR}-${BUILDDATE}"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "dtb_name=${DTB_NAME}" >> $GITHUB_OUTPUT

          if [[ ! -f "${BOOT_DIR}/Image" ]]; then
            echo "::error::未找到内核镜像文件 (Image)，构建失败"
            exit 1
          fi
          echo "内核镜像校验通过: ${BOOT_DIR}/Image"

          # 寻找编译出的所有 dtb 文件并合并为单文件 dtb
          find "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dts/" -name "*.dtb" -type f -exec cat {} + > "${BOOT_DIR}/dtb"

          if [[ ! -s "${BOOT_DIR}/dtb" ]]; then
            echo "::error::未找到编译出的 DTB 文件，构建失败"
            exit 1
          fi
          echo "DTB 文件校验及合并通过: ${BOOT_DIR}/dtb"

      - name: 打包 AnyKernel3
        if: inputs.use_anykernel
        id: pack_anykernel
        run: |
          BOOT_DIR="${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot"
          BUILDDATE="${{ steps.setup_env.outputs.builddate }}"
          SUFFIX="${{ inputs.kernel_suffix }}"
          SUFFIX_STR="${SUFFIX:+-${SUFFIX}}"
          AK3_NAME="${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}${SUFFIX_STR}_${BUILDDATE}"

          # 复制内核与设备树镜像到 AnyKernel3
          if [ -f "${BOOT_DIR}/Image" ]; then
            cp -f "${BOOT_DIR}/Image" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/Image.gz" ]; then
            cp -f "${BOOT_DIR}/Image.gz" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/dtb" ]; then
            cp -f "${BOOT_DIR}/dtb" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/dtbo" ]; then
            cp -f "${BOOT_DIR}/dtbo" ./AnyKernel3/
          fi
          if [ -f "${BOOT_DIR}/dtbo.img" ]; then
            cp -f "${BOOT_DIR}/dtbo.img" ./AnyKernel3/
          fi

          cd AnyKernel3/
          zip -q -r "${{ github.workspace }}/${AK3_NAME}.zip" *
          echo "ak3name=${AK3_NAME}.zip" >> $GITHUB_OUTPUT

      # ── 12. 上传产物 ──
      - name: 上传 AnyKernel3 刷入包
        if: inputs.use_anykernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack_anykernel.outputs.ak3name }}
          path: ${{ github.workspace }}/${{ steps.pack_anykernel.outputs.ak3name }}
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_image.outputs.image_name }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: error
          retention-days: 7

      - name: 上传 dtb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_image.outputs.dtb_name }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  #  发布 Release
  # ============================================================
  release:
    name: 发布 Release
    if: inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./release_files

      - name: 设置发布环境变量
        run: |
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG_HEAD="chopin-build"

          if [[ -n "${{ inputs.kernel_suffix }}" ]]; then
            FULL_VERSION="${{ env.KERNEL_NAME }}-${{ inputs.kernel_suffix }}"
          else
            FULL_VERSION="${{ env.KERNEL_NAME }}"
          fi

          # KSU 状态
          if [[ "${{ inputs.ksu_enabled }}" == "true" ]]; then
            KSU_STATUS="ReSukiSU (Manual Hook)"
          else
            KSU_STATUS="未集成"
          fi

          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "KSU_STATUS=$KSU_STATUS" >> $GITHUB_ENV

      - name: 创建 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 构建信息
          - 设备: chopin (Redmi Note 10 Pro / POCO X3 GT)
          - 内核分支: ${{ env.KERNEL_BRANCH }}
          - 内核版本: ${{ env.FULL_VERSION }}
          - 编译时间: ${{ env.TIME_FORM }}
          - KernelSU: ${{ env.KSU_STATUS }}
          - AnyKernel3 打包: ${{ inputs.use_anykernel }}
          - CCache 加速: ${{ inputs.ccache_enabled }}
          - 伪装启用: ${{ inputs.fake_enabled }}
          - 伪装信息: ${{ env.KBUILD_BUILD_USER }}@${{ env.KBUILD_BUILD_HOST }}
          - 伪装时间: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          - 伪装版本: ${{ env.KBUILD_BUILD_VERSION }}
          EOF

          # 收集所有发布文件
          shopt -s nullglob
          RELEASE_FILES=()

          # AnyKernel3 zip
          for f in ./release_files/*/*.zip; do
            RELEASE_FILES+=("$f")
          done

          # Image 文件
          for f in ./release_files/*/Image; do
            RELEASE_FILES+=("$f")
          done

          # dtb 文件
          for f in ./release_files/*/dtb; do
            RELEASE_FILES+=("$f")
          done

          if [ ${#RELEASE_FILES[@]} -eq 0 ]; then
            echo "::error::未找到任何可发布的文件"
            exit 1
          fi

          echo "即将发布以下文件:"
          printf '  - %s\n' "${RELEASE_FILES[@]}"

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.FULL_VERSION }}-${{ env.TIME }}" \
            --notes-file release_notes.md \
            "${RELEASE_FILES[@]}"
